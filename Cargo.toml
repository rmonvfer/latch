[package]
name = "terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.6.7", features = ["derive"] }
async-channel = "2.5.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "2117a376b97104049f60e843afa92f18fa7f5748" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2117a376b97104049f60e843afa92f18fa7f5748", features = ["font-kit"] }
libghostty-vt = "0.2.2"
libc = "0.2.190"
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.144"
tokio = { version = "1.53.2", features = ["rt", "macros", "io-std"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
log = "0.4.16"
env_logger = "0.11"
git2 = "0.21.0"
portable-pty = "0.9.0"
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"

[profile.dev.package."*"]
opt-level = 2
