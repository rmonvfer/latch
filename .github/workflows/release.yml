name: macOS release

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release planning
        run: |
          python3 script/test-release-plan.py
          python3 script/test-update-feed.py
      - id: release
        name: Select release channel and tag
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
        run: script/release-plan "$BRANCH" "$RUN_NUMBER" "$EVENT" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_TERM_COLOR: always
      LATCH_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          xcodebuild -downloadComponent MetalToolchain
          rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-${{ matrix.architecture }}
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --release --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --release --workspace
      - name: Test update relaunch handoff
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            crates/latch-platform/tests/updater_relaunch.m -o target/updater-relaunch-test
          ./target/updater-relaunch-test
      - name: Import Developer ID certificate
        if: github.event_name != 'pull_request'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$CERTIFICATE" || -z "$CERTIFICATE_PASSWORD" || -z "$SIGNING_IDENTITY" ]]; then
            echo "Developer ID signing secrets are required for release builds." >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/latch-signing.p12"
          keychain_path="$RUNNER_TEMP/latch-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          rm "$certificate_path"
          echo "LATCH_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "LATCH_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Select pull request signing
        if: github.event_name == 'pull_request'
        run: echo 'LATCH_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Configure Apple notarization
        if: github.event_name != 'pull_request'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          REQUIRE_NOTARIZATION: ${{ vars.LATCH_REQUIRE_NOTARIZATION }}
        run: |
          if [[ -z "$NOTARY_KEY" && -z "$NOTARY_KEY_ID" && -z "$NOTARY_ISSUER_ID" ]]; then
            if [[ "$REQUIRE_NOTARIZATION" == 1 ]]; then
              echo "Apple notarization credentials are required for this release." >&2
              exit 1
            fi
            echo "Notarization credentials are absent; this release will be Developer ID signed without an Apple ticket."
            exit 0
          fi
          if [[ -z "$NOTARY_KEY" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "All three APPLE_NOTARY_KEY, APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER_ID secrets are required." >&2
            exit 1
          fi
          notary_key="$RUNNER_TEMP/latch-notary.p8"
          umask 077
          printf '%s' "$NOTARY_KEY" > "$notary_key"
          xcrun notarytool store-credentials latch-release \
            --key "$notary_key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$LATCH_SIGNING_KEYCHAIN"
          {
            echo 'LATCH_NOTARY_PROFILE=latch-release'
            echo "LATCH_NOTARY_KEYCHAIN=$LATCH_SIGNING_KEYCHAIN"
            echo 'LATCH_REQUIRE_NOTARIZATION=1'
          } >> "$GITHUB_ENV"
      - name: Build and package
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.SPARKLE_PRIVATE_KEY || '' }}
          LATCH_REQUIRE_UPDATE_SIGNATURE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          LATCH_REQUIRE_DEVELOPER_ID: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: script/package-mac "$RELEASE_TAG"
      - name: Remove signing credentials
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/latch-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/latch-signing.p12"
          rm -f "$RUNNER_TEMP/latch-notary.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.architecture }}
          path: |
            target/dist/Latch-${{ needs.plan.outputs.tag }}-macos-${{ matrix.architecture }}.zip
            target/dist/Latch-${{ needs.plan.outputs.tag }}-macos-${{ matrix.architecture }}.zip.sha256
            ${{ github.event_name != 'pull_request' && format('target/dist/{0}-{1}.xml', needs.plan.outputs.channel, matrix.architecture) || '' }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check ./*.sha256
      - name: Publish GitHub release
        run: |
          if gh release list --limit 1000 --json tagName,isDraft --jq \
            '.[] | select(.tagName == env.RELEASE_TAG and .isDraft == false) | .tagName' \
            | grep -Fxq "$RELEASE_TAG"; then
            echo "$RELEASE_TAG is already published."
            exit 0
          fi
          flags=(--latest)
          create_flags=()
          title="Latch $RELEASE_TAG"
          if [[ "$RELEASE_BRANCH" == dev ]]; then
            flags=(--prerelease --latest=false)
            create_flags=(--prerelease)
            title="Latch $RELEASE_TAG (Beta)"
          fi
          cat > notes.md <<'NOTES'
          Download the ZIP for Apple Silicon (`arm64`) or Intel (`x86_64`), unzip it, and move `Latch.app` to Applications. Latch checks its channel for signed updates and preserves compatible running terminal sessions across app replacement.

          Builds are signed with an Apple Developer ID certificate and hardened runtime. Apple notarization is included when the release has notarization credentials; without a notarization ticket, macOS may require approval under System Settings > Privacy & Security on first launch.

          Each ZIP has a SHA-256 checksum. The app bundle includes the application and theme licenses.
          NOTES
          drafts=$(gh release list --limit 1000 --json tagName,isDraft --jq \
            '.[] | select(.tagName == env.RELEASE_TAG and .isDraft == true) | .tagName')
          if [[ "$drafts" != "$RELEASE_TAG" ]]; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" \
              --title "$title" --draft --generate-notes --notes-file notes.md "${create_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
      - name: Publish signed update feeds
        run: |
          if ! gh release view update-feeds >/dev/null 2>&1; then
            gh release create update-feeds --target "$RELEASE_COMMIT" \
              --title "Latch update feeds" --prerelease --latest=false \
              --notes "Signed update metadata for Latch's production and beta channels. Download the app from its versioned releases." \
              || gh release view update-feeds >/dev/null
          fi
          gh release download "$RELEASE_TAG" --pattern '*.xml' --dir published-feeds
          for feed in published-feeds/*.xml; do
            name=$(basename "$feed")
            if gh release view update-feeds --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              mkdir -p current-feeds
              gh release download update-feeds --pattern "$name" --dir current-feeds
              if ! python3 - "$feed" "current-feeds/$name" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          version = './channel/item/{http://www.andymatuschak.org/xml-namespaces/sparkle}version'
          incoming = ET.parse(sys.argv[1]).findtext(version)
          current = ET.parse(sys.argv[2]).findtext(version)
          sys.exit(0 if current is None or int(incoming) >= int(current) else 1)
          PY
              then
                echo "A newer $name feed is already published."
                continue
              fi
            fi
            gh release upload update-feeds "$feed" --clobber
          done
